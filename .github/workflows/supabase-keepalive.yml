name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 */6 * * *'   # Cada 6 horas
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node supabase-keepalive.mjs

      - name: Escritura keep-alive (RPC)
        env:
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxbmltcmpkdHl0ZWZnZ2t3aGZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MTc0MTQsImV4cCI6MjEwNTQ5MzQxNH0.wCxSsMVsfV9g4d8S-VjPVZmiKLerIuBvdVbMzRPdZQc
          BASE: https://uqnimrjdtytefggkwhfv.supabase.co
        run: |
          # Requiere haber ejecutado keepalive_setup.sql en Supabase; si no, solo avisa
          W=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/rest/v1/rpc/ping_keepalive" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Escritura: HTTP $W"
