name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node supabase-keepalive.mjs
